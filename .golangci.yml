version: "2"

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet checks (shadow, printf, etc.)
    - ineffassign    # assigned but never used
    - staticcheck    # comprehensive static analysis (includes gosimple + unused)
    - misspell       # common spelling mistakes
    - godot          # comment punctuation
    - nilerr         # return nil instead of err
    - exhaustive     # exhaustive switch on enums
  settings:
    misspell:
      # Eclipse Mosquitto (the MQTT broker of the PubSub tests) is not a
      # misspelling of "mosquito"; --fix would rename its image.
      ignore-rules:
        - mosquitto
    exhaustive:
      default-signifies-exhaustive: true
    staticcheck:
      checks:
        - "all"

formatters:
  enable:
    - gofmt          # formatting
    - goimports      # import grouping / formatting

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m