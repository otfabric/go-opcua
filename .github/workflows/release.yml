name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v3.8.0
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-opcua
      update-major-tag: false
      # chaos/... runs in the chaos job of CI (see ci.yml): next to the
      # other packages under the race detector it starves them of CPU.
      # server, uafx/fxcm and uafx/fxserver run in the server job of CI
      # (5 min race): beside the others each goes over the 120 s timeout
      # this workflow gives a package (the v1.39.1 release run failed so).
      # cmd/ is tested, as in ci.yml (CI-005).
      test-exclude-regex: "(/examples($|/)|/chaos($|/)|/server$|/uafx/fxcm$|/uafx/fxserver$)"
    secrets: inherit
