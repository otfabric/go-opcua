name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v2
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-opcua
      update-major-tag: false
      # chaos/... runs in the chaos job of CI (see ci.yml): next to the
      # other packages under the race detector it starves them of CPU.
      test-exclude-regex: "(/examples($|/)|/cmd($|/)|/chaos($|/))"
    secrets: inherit
