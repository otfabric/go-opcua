name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: read

jobs:
  open62541:
    name: OPC UA interop — open62541
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop matrix
        env:
          # Digest-pinned opcua-interop v0.6.0 multi-arch indexes:
          # https://github.com/otfabric/opcua-interop/releases/tag/v0.6.0
          # Current digests: https://github.com/otfabric/opcua-interop/actions/runs/38136156545
          # Set OPEN62541_IMAGE / MILO_IMAGE in the env to test local builds.
          OPEN62541_IMAGE: ghcr.io/otfabric/opcua-interop-open62541@sha256:d8cdfd67c9dd71713515fdf0e34533d7ff9f6d004bd5c7ceb349db40e325a1f2
          MILO_IMAGE: ghcr.io/otfabric/opcua-interop-milo@sha256:95ad873ff5ae86a35815a1c6db2b75963675040f3283307e57ac10273194ab3f
          OPCUA_INTEROP_REQUIRE_CAPABILITIES: "1"
        run: make interop

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-opcua-interop-diagnostics
          path: artifacts/
          if-no-files-found: ignore
