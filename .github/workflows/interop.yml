name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The suite (~470 tests, mostly sequential docker containers) runs as six
  # parallel shards; `make interop-shard` deals the tests out round-robin by
  # name. Run the whole suite locally with `make interop`.
  shard:
    name: Interop shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # opcua-interop release the suite and interop/coverage.json are written
      # against (interopVersion in interop/harness_test.go). Keep in step
      # with the image digests below.
      OPCUA_INTEROP_REF: v0.8.2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      # The security tests (RSA and ECC policies, user tokens, secured reverse
      # connect) need the opcua-interop test PKI. It is generated, never
      # committed: take the generator of the release the suite is written
      # against. Without it the suite fails under
      # OPCUA_INTEROP_REQUIRE_CAPABILITIES=1 instead of skipping those tests.
      - name: Check out opcua-interop (test PKI generator)
        uses: actions/checkout@v7
        with:
          repository: otfabric/opcua-interop
          ref: ${{ env.OPCUA_INTEROP_REF }}
          path: .opcua-interop
          sparse-checkout: certs

      - name: Generate the test PKI (RSA + ECC)
        run: |
          openssl version
          bash .opcua-interop/certs/generate.sh
          echo "OPCUA_INTEROP_PKI_DIR=${GITHUB_WORKSPACE}/.opcua-interop/certs/test-pki" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop matrix
        env:
          # Digest-pinned opcua-interop v0.8.2 multi-arch indexes:
          # https://github.com/otfabric/opcua-interop/releases/tag/v0.8.2
          # Release run: https://github.com/otfabric/opcua-interop/actions/runs/40055105259
          # Set OPEN62541_IMAGE / MILO_IMAGE in the env to test local builds.
          OPEN62541_IMAGE: ghcr.io/otfabric/opcua-interop-open62541@sha256:e035d07896a650a820a552e778202bc847c78855ff3d4ae0de1f172606d48866
          MILO_IMAGE: ghcr.io/otfabric/opcua-interop-milo@sha256:2d84fa47b67d785fe84ebeb3e4d41ec75841e459fd43fd689bf45c1fddc9a15e
          OPCUA_INTEROP_REQUIRE_CAPABILITIES: "1"
        run: |
          # Pull both adapter images once, up front, instead of inside the
          # first test that starts each of them.
          docker pull --quiet "${OPEN62541_IMAGE}" &
          docker pull --quiet "${MILO_IMAGE}" &
          wait
          make interop-shard SHARD=${{ matrix.shard }} SHARDS=6

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-opcua-interop-diagnostics-shard-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore

  # One result for the whole suite (branch protection and badges). Not run
  # when the workflow was cancelled (a newer push), so a superseded run shows
  # as cancelled rather than failed.
  result:
    name: OPC UA interop — open62541
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "::error::interop shards: ${{ needs.shard.result }}"
            exit 1
          fi
