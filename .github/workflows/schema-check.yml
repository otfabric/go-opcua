name: Upstream schema check
run-name: "Upstream schema check (${{ github.event_name }}) by @${{ github.actor }}"

# Downloads the OPC Foundation schema files at the head of the upstream
# `latest` branch with schema/update-schema.sh and compares them with the
# copies pinned in schema/manifest.json: the commit, the inputs whose content
# changed, and the Version, ModelVersion, PublicationDate and RequiredModels
# of each NodeSet. When upstream has moved, it opens (or refreshes) a tracking
# issue; nothing is committed. The update itself stays manual:
# ./schema/update-schema.sh latest && make gen.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: schema-check
  cancel-in-progress: false

env:
  ISSUE_LABEL: schema-update
  UPSTREAM_REPO: OPCFoundation/UA-Nodeset

jobs:
  check:
    name: Compare vendored schema with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download upstream schema
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The default shell stops at the first failure (bash -e).
          set +e -uo pipefail
          cp schema/manifest.json "$RUNNER_TEMP/manifest.pinned.json"
          # update fails after writing the files when a RequiredModel is no
          # longer satisfied; that is reported, not a failure of this job.
          ./schema/update-schema.sh latest 2>&1 | tee "$RUNNER_TEMP/update.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Compare with the pinned inputs
        id: diff
        env:
          UPDATE_STATUS: ${{ steps.update.outputs.status }}
        run: |
          set -euo pipefail

          # The branch moves with every companion specification; only the
          # content of the inputs counts.
          inputs='[.inputs[] | [.path, .sha256]]'
          if [ "$(jq -c "${inputs}" schema/manifest.json)" = "$(jq -c "${inputs}" "$RUNNER_TEMP/manifest.pinned.json")" ]; then
            if [ "${UPDATE_STATUS}" != "0" ]; then
              echo "The download failed before a manifest was written." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The pinned inputs match upstream $(jq -r .commit schema/manifest.json)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Identifies this exact upstream content (the SHA-256 of every
          # input), so the same change is reported once even if the tracking
          # issue is closed unresolved.
          fingerprint=$(jq -r '.inputs[] | .path + " " + .sha256' schema/manifest.json | sha256sum | cut -c1-16)

          {
            go run ./internal/cmd/schemamanifest diff "$RUNNER_TEMP/manifest.pinned.json" schema/manifest.json
            if [ "${UPDATE_STATUS}" != "0" ]; then
              echo
              echo "**The upstream models do not satisfy each other's RequiredModels** (OPC 10000-6 §F.2):"
              echo
              echo '```'
              grep -i -A20 'schemamanifest:' "$RUNNER_TEMP/update.log" || tail -20 "$RUNNER_TEMP/update.log"
              echo '```'
            fi
          } > "$RUNNER_TEMP/schema-table.md"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream schema differs from the pinned inputs"
            echo
            cat "$RUNNER_TEMP/schema-table.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh tracking issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.diff.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          marker="<!-- schema-fingerprint:${FINGERPRINT} -->"

          {
            echo "${marker}"
            echo "The OPC Foundation schema files at the head of the \`latest\` branch of [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) no longer match the inputs pinned in \`schema/manifest.json\`."
            echo
            cat "$RUNNER_TEMP/schema-table.md"
            echo
            echo "### Update manually"
            echo
            echo '```sh'
            echo "./schema/update-schema.sh latest"
            echo "make gen"
            echo "make test"
            echo '```'
            echo
            echo "Review the generated diff (new NodeIds, StatusCodes, types and default permissions) and the new pin in \`schema/manifest.json\` before committing."
            echo
            echo "Detected by [this workflow run](${RUN_URL}). Closing this issue without updating silences it until upstream changes again."
          } > "$RUNNER_TEMP/issue-body.md"

          gh label create "${ISSUE_LABEL}" --color 0E8A16 \
            --description "Upstream OPC UA schema changed; vendored copy needs a manual update" \
            --force

          # Already reported (open, or closed as "not now")? Then stay quiet.
          reported=$(gh issue list --label "${ISSUE_LABEL}" --state all --limit 100 \
            --search "\"schema-fingerprint:${FINGERPRINT}\" in:body" --json number --jq '.[0].number // empty')
          if [ -n "${reported}" ]; then
            echo "Upstream state ${FINGERPRINT} is already tracked in #${reported}; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Upstream moved again while an issue is still open: refresh it
          # instead of opening a second one.
          open=$(gh issue list --label "${ISSUE_LABEL}" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${open}" ]; then
            gh issue edit "${open}" --body-file "$RUNNER_TEMP/issue-body.md"
            gh issue comment "${open}" --body "Upstream schema changed again; the description above now reflects the current difference (${RUN_URL})."
            echo "Refreshed tracking issue #${open}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          url=$(gh issue create \
            --title "Upstream OPC UA schema update available" \
            --label "${ISSUE_LABEL}" \
            --body-file "$RUNNER_TEMP/issue-body.md")
          echo "Opened ${url}." | tee -a "$GITHUB_STEP_SUMMARY"
