# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      codecov-name: go-opcua
      go-versions: '["1.26","1.27"]'
      run-govulncheck: true
      # No coverage-min here: this job no longer runs the server package's
      # tests (87 % alone), so the 94 % gate moved to coverage-merged (make coverage-merged-check), on the
      # same merged metric (95.5 % on #43; 95.4 % before the split). The
      # per-package gate of the coverage-gate job stays.
      fuzz-time: 10s
      # The fuzz job runs all 69 targets in turn: about 16 minutes on a laptop, over
      # the default of 15.
      timeout-minutes: 30
      # The default exclusions, without cmd/ (its generators have tests:
      # CI-005), plus chaos/..., which runs in the chaos job, and the
      # server, uafx/fxcm and uafx/fxserver packages, which run in the
      # server job.
      # The shared workflow has one exclusion list for its test, race and
      # coverage jobs, so the server job runs all three for them.
      test-exclude-regex: "(/example(s)?($|/)|/chaos($|/)|/server$|/uafx/fxcm$|/uafx/fxserver$)"
      # Match Makefile COVER_PKGS so Codecov uses the same merged metric as
      # `make coverage` (conformance hits count toward core packages).
      coverpkg: github.com/otfabric/go-opcua,github.com/otfabric/go-opcua/ua,github.com/otfabric/go-opcua/uacp,github.com/otfabric/go-opcua/uasc,github.com/otfabric/go-opcua/uapolicy,github.com/otfabric/go-opcua/server,github.com/otfabric/go-opcua/server/aggregate,github.com/otfabric/go-opcua/server/pushstore,github.com/otfabric/go-opcua/monitor,github.com/otfabric/go-opcua/errors,github.com/otfabric/go-opcua/id,github.com/otfabric/go-opcua/internal/stats,github.com/otfabric/go-opcua/internal/mdns,github.com/otfabric/go-opcua/internal/profiles
    secrets: inherit

  # The chaos-monkey and parallelism suites (chaos/..., see chaos/doc.go)
  # run in their own job: they keep every CPU of a runner busy for a minute
  # or more under the race detector, and next to the other packages in the
  # shared Race job they starved timing-sensitive tests there of CPU.
  chaos:
    name: Chaos (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Chaos suites (race)
        run: go test -count=1 -race -timeout=10m ./chaos/...

  # The server package runs apart from the shared jobs: in the shared Race
  # job, next to every other package, it hit the 120 s package timeout
  # (#43, Go 1.26 and 1.27). The plain run keeps the shared 120 s timeout;
  # the race run alone gets 5 minutes (about 80 s on a laptop). uafx/fxcm
  # runs here too for the same reason (#48): its tests start about thirty
  # AutomationComponent servers, and importing the UAFX NodeSets takes
  # about 1.2 s per server under the race detector (0.1 s without).
  # uafx/fxserver too (#50): it took 96 to 114 s of the 120 s beside the
  # other packages and went over with the ConnectionManager tests. The race
  # run takes the three one at a time (-p 1): side by side on a two-CPU
  # runner the durable ConnectionManager tests of uafx/fxcm starved
  # uafx/fxserver past its 5 minutes and the 1 s session timeout test of
  # server (#55). The coverage run of coverage-merged does the same.
  # The race run's package timeout is 10 minutes: before v1.40.0 uafx/fxcm
  # took 238 s and uafx/fxserver 186 s of the 5 minutes on a 2-CPU runner
  # (#56), and 369 s and 414 s with GOMAXPROCS=2 locally. The tests' own
  # deadlines are unchanged.
  # Both runs take the three packages one at a time, one step each. The
  # plain run took them side by side until 2026-11-28, and on seven runs of
  # #58, #61, #63, #65, #67 and #70 the hosted VM was shut down about 60 s into
  # that step, before any package had finished: bash ended with exit 143 and
  # "The runner has received a shutdown signal", or the runner never
  # reported again and the job ran into its limit with no log. The race and
  # coverage runs, one package at a time, never were. The cause is memory:
  # run alone on this runner (4 CPUs, 16 GB, 3 GB swap; #72), the largest
  # process of uafx/fxcm peaks at 8.0 to 8.5 GB, of uafx/fxserver at 7.6 to
  # 7.8 GB and of server at 1.8 GB, 17 GB or more side by side. A parent
  # test that waits for its parallel subtests gives up its -parallel slot
  # but keeps its servers, so the fixtures of every parent add up. The step
  # timeouts end a step whose go test outlives its own -timeout and kill
  # (one minute after it); a VM that is shut down ends only at the job's
  # limit, which is short for the plain run. Each step prints its wall time
  # and the peak RSS of its largest process.
  server:
    name: ${{ matrix.race && 'Race' || 'Test' }} server (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    # Usual totals: 4 minutes plain, 12 race.
    timeout-minutes: ${{ matrix.race && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
        race: [false, true]
    env:
      # The UAFX multicast end-to-end test (uafx/fxcm) must run here, not
      # skip: it fails when no interface carries UDP multicast.
      GO_OPCUA_MULTICAST_REQUIRE: "1"
      GO_TEST_FLAGS: ${{ matrix.race && '-race -timeout=10m' || '-timeout=120s' }}
      # The format of GNU time.
      TIME: "%e s elapsed, peak RSS of the largest process %M KB"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Runner resources
        run: |
          echo "CPUs: $(nproc)"
          free -m
          df -h .
      # A later package runs after an earlier one failed, so that a run
      # reports all three.
      - name: Test server
        timeout-minutes: ${{ matrix.race && 12 || 6 }}
        run: /usr/bin/time go test -count=1 $GO_TEST_FLAGS ./server
      - name: Test uafx/fxcm
        if: ${{ !cancelled() }}
        timeout-minutes: ${{ matrix.race && 12 || 6 }}
        run: /usr/bin/time go test -count=1 $GO_TEST_FLAGS ./uafx/fxcm
      - name: Test uafx/fxserver
        if: ${{ !cancelled() }}
        timeout-minutes: ${{ matrix.race && 12 || 6 }}
        run: /usr/bin/time go test -count=1 $GO_TEST_FLAGS ./uafx/fxserver
      - name: Kernel out-of-memory messages
        if: ${{ failure() }}
        run: sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' || echo "none"

  # The shared coverage job no longer runs the tests of the server and
  # uafx/fxcm packages, so this job runs them with the same -coverpkg, merges the profile into the
  # shared job's (go tool cover adds up blocks seen in both), gates the total
  # at the repository minimum and uploads the server profile to Codecov, which
  # merges uploads of one commit.
  coverage-merged:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Server, uafx/fxcm and uafx/fxserver tests with coverage
        env:
          # Must match coverpkg of the ci job.
          COVERPKG: github.com/otfabric/go-opcua,github.com/otfabric/go-opcua/ua,github.com/otfabric/go-opcua/uacp,github.com/otfabric/go-opcua/uasc,github.com/otfabric/go-opcua/uapolicy,github.com/otfabric/go-opcua/server,github.com/otfabric/go-opcua/server/aggregate,github.com/otfabric/go-opcua/server/pushstore,github.com/otfabric/go-opcua/monitor,github.com/otfabric/go-opcua/errors,github.com/otfabric/go-opcua/id,github.com/otfabric/go-opcua/internal/stats,github.com/otfabric/go-opcua/internal/mdns,github.com/otfabric/go-opcua/internal/profiles
        # 10m like the race run of the server job: with -covermode=atomic and
        # this -coverpkg, uafx/fxcm alone took 120.3 s on a 2-CPU runner
        # after C3.3 (74 s on 10 cores); its tests' own deadlines are
        # unchanged. It usually takes 3 to 6 minutes.
        timeout-minutes: 20
        run: go test -count=1 -p 1 -timeout=10m -covermode=atomic -coverpkg="$COVERPKG" -coverprofile=server.out ./server ./uafx/fxcm ./uafx/fxserver
      - name: Download the shared coverage profile
        uses: actions/download-artifact@v7
        with:
          name: coverage-go-mod-version
          path: shared
      - name: Coverage gate (merged)
        # The minimum is COVERAGE_MIN in the Makefile (94 %, go-ci
        # coverage-min before the server split); never lower it.
        run: |
          { cat shared/coverage.out; tail -n +2 server.out; } > merged.out
          make coverage-merged-check PROFILE=merged.out
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: server.out
          flags: unittests
          name: go-opcua
          fail_ci_if_error: false

  # Every library package must reach 90% statement coverage on its own,
  # generated code excluded (make coverage-pkg-check, internal/cmd/coverage-gate).
  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Per-package coverage gate
        run: make coverage-pkg-check

  gen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Regenerate and check for drift
        run: make check-gen

  # The Ethernet transport (pubsub/transport/eth) with real AF_PACKET raw
  # sockets: the tests skip without CAP_NET_RAW, so build the test binary as
  # the runner user and run it as root, on the loopback interface and on a
  # veth pair (publisher on veth0, subscriber on veth1). GO_OPCUA_ETH_REQUIRE
  # makes a test that would skip fail.
  pubsub-eth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Create a veth pair
        run: |
          sudo ip link add veth0 type veth peer name veth1
          sudo ip link set veth0 up
          sudo ip link set veth1 up
      - name: Build the test binary
        run: go test -c -race -o eth.test ./pubsub/transport/eth
      - name: Run the Ethernet tests as root
        working-directory: pubsub/transport/eth
        run: |
          sudo GO_OPCUA_ETH_REQUIRE=1 GO_OPCUA_ETH_PAIR=veth0,veth1 ../../../eth.test -test.v -test.count=1 -test.run 'Real|E2E'
          sudo GO_OPCUA_ETH_REQUIRE=1 GO_OPCUA_ETH_PAIR=veth0,veth1 GO_OPCUA_ETH_IFACE=veth0 ../../../eth.test -test.count=5
