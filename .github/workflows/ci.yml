name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: go-opcua
      go-versions: '["1.25","1.26"]'
      # Match Makefile COVER_PKGS so Codecov uses the same merged metric as
      # `make coverage` (conformance hits count toward core packages).
      coverpkg: github.com/otfabric/go-opcua,github.com/otfabric/go-opcua/ua,github.com/otfabric/go-opcua/uacp,github.com/otfabric/go-opcua/uasc,github.com/otfabric/go-opcua/uapolicy,github.com/otfabric/go-opcua/server,github.com/otfabric/go-opcua/monitor,github.com/otfabric/go-opcua/errors,github.com/otfabric/go-opcua/id,github.com/otfabric/go-opcua/internal/stats
    secrets: inherit

  gen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Regenerate
        run: go generate ./...
      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'go generate ./...' and commit."
            git diff --stat
            exit 1
          fi
