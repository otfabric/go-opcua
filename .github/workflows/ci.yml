name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      codecov-name: go-opcua
      go-versions: '["1.26","1.27"]'
      run-govulncheck: true
      # Measured 95.4 % with the coverpkg below (go-ci method). The
      # per-package gate of the coverage-gate job stays.
      coverage-min: "94"
      fuzz-time: 10s
      # The fuzz job runs all 63 targets in turn: 16 minutes on a laptop, over
      # the default of 15.
      timeout-minutes: 30
      # The default exclusions plus chaos/..., which runs in the chaos job.
      test-exclude-regex: "(/example(s)?($|/)|/cmd($|/)|/chaos($|/))"
      # Match Makefile COVER_PKGS so Codecov uses the same merged metric as
      # `make coverage` (conformance hits count toward core packages).
      coverpkg: github.com/otfabric/go-opcua,github.com/otfabric/go-opcua/ua,github.com/otfabric/go-opcua/uacp,github.com/otfabric/go-opcua/uasc,github.com/otfabric/go-opcua/uapolicy,github.com/otfabric/go-opcua/server,github.com/otfabric/go-opcua/monitor,github.com/otfabric/go-opcua/errors,github.com/otfabric/go-opcua/id,github.com/otfabric/go-opcua/internal/stats,github.com/otfabric/go-opcua/internal/mdns
    secrets: inherit

  # The chaos-monkey and parallelism suites (chaos/..., see chaos/doc.go)
  # run in their own job: they keep every CPU of a runner busy for a minute
  # or more under the race detector, and next to the other packages in the
  # shared Race job they starved timing-sensitive tests there of CPU.
  chaos:
    name: Chaos (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Chaos suites (race)
        run: go test -count=1 -race -timeout=10m ./chaos/...

  # Every library package must reach 90% statement coverage on its own,
  # generated code excluded (make coverage-pkg-check, internal/cmd/coverage-gate).
  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Per-package coverage gate
        run: make coverage-pkg-check

  gen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Regenerate and check for drift
        run: make check-gen

  # The Ethernet transport (pubsub/transport/eth) with real AF_PACKET raw
  # sockets: the tests skip without CAP_NET_RAW, so build the test binary as
  # the runner user and run it as root, on the loopback interface and on a
  # veth pair (publisher on veth0, subscriber on veth1). GO_OPCUA_ETH_REQUIRE
  # makes a test that would skip fail.
  pubsub-eth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Create a veth pair
        run: |
          sudo ip link add veth0 type veth peer name veth1
          sudo ip link set veth0 up
          sudo ip link set veth1 up
      - name: Build the test binary
        run: go test -c -race -o eth.test ./pubsub/transport/eth
      - name: Run the Ethernet tests as root
        working-directory: pubsub/transport/eth
        run: |
          sudo GO_OPCUA_ETH_REQUIRE=1 GO_OPCUA_ETH_PAIR=veth0,veth1 ../../../eth.test -test.v -test.count=1 -test.run 'Real|E2E'
          sudo GO_OPCUA_ETH_REQUIRE=1 GO_OPCUA_ETH_PAIR=veth0,veth1 GO_OPCUA_ETH_IFACE=veth0 ../../../eth.test -test.count=5
